[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-mocksite"
version = "0.1.0"
description = "Deterministic HTTP scenarios for scraper integration tests"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.11.18"]

[project.scripts]
mocksite = "mocksite.cli:main"

[tool.setuptools.package-data]
mocksite = ["panel.html", "examples/*.json"]
