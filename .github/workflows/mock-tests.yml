name: Scraper mock integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAROU_TEST_ARTIFACTS: outputs/mock-tests
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            tools/mocksite/pyproject.toml
      - run: python -m pip install -r requirements-test.txt ./tools/mocksite
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --junitxml=outputs/mock-tests/results.xml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mock-test-diagnostics
          path: outputs/mock-tests
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f tools/mocksite/compose.yaml up --build --wait
      - run: curl --fail http://127.0.0.1:8765/__mock/api/v1/status
      - run: docker compose -f tools/mocksite/compose.yaml down
        if: always()
